[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoom-phone-mcp"
version = "0.1.0"
description = "MCP server for Zoom Phone — auto receptionists, call queues, IVR, voicemail, and full telephony management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Cody C", email = "ccessna@llmed.org"}]
keywords = ["zoom", "phone", "mcp", "model-context-protocol", "telephony", "ivr", "call-queue", "auto-receptionist"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
]

dependencies = [
    "mcp>=1.27.0,<2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
zoom-phone-mcp = "zoom_phone_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/fujitsupolycom/zoom-phone-mcp"
Repository = "https://github.com/fujitsupolycom/zoom-phone-mcp"
Issues = "https://github.com/fujitsupolycom/zoom-phone-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
